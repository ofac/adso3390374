<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>20-PseudoClasses</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sacramento&display=swap');
        main div.options {
            margin-block: 1rem;
        }
        /*
        div.options a:link,
        div.options a:visited
        */
        div.options a:is(:link, :visited) {
            background-color: #0009;
            color: #fff9;
            padding: 0.4rem 0.6rem;
            text-decoration: none;
        }
        /* 
        div.options a:hover
        */
        div.options a:is(:hover) {
            background-color: #000;
            color: #fff;
        }
        /*
        div.options a:active
        */
        div.options a:is(:active) {
            background: #dc143c;
        }
        /* 
            div.options a:first-child,
            div.options a:last-child  
        */
        div.options a:is(:first-child, :last-child) {
            background-color: #a779d4;
        }
        input {
            margin-block: 0.4rem;
            padding: 0.4rem 0.8rem;
            outline: none;
        }
        /* input:focus */
        input:is(:focus) {
            border: 2px solid #0f09;
        }
        p.paragraph:first-line {
            color: #fff;
            background-color: #0f03;
        }
        p.paragraph:first-letter {
            color: #0f0a;
            font-family: Sacramento;
            font-size: 4rem;
        }
        div.heart {
            background-color: transparent;
            position: relative;
            margin-block: 2rem;
            height: 100px;
            width: 50px;
        }
        div.heart::before {
            background-color: #a779d4;
            border-radius: calc(50px/2) calc(50px/2) 0 0;
            position: absolute;
            content: "";
            height: 80px;
            width: 50px;
            transform: rotate(-45deg) translateX(20px);
            left: 100px;
            top: 0;
        }
        div.heart::after {
            background-color: #a779d4;
            border-radius: 25px 25px 0 0;
            position: absolute;
            content: "";
            height: 80px;
            width: 50px;
            transform: rotate(45deg) translateX(-20px);
            left: 150px;
            top: 0;
        }
    </style>
</head>
<body class="css">
    <a href="index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path></svg>
    </a>
    <main>
        <header class="mainmenu">
            <h1>20-PseudoClasses</h1>
            <h3>Is used to define a special state of an element.</h3>
        </header>
        <section>
            <h4>:link|:hover|:active|:visited</h4>
            <h4>:first-child|:last-child</h4>
            <div class="options">
                <a href="#">Option 1</a>
                <a href="#">Option 2</a>
                <a href="#">Option 3</a>
            </div>
            <h4>:focus</h4>
            <input type="text" placeholder="Enter your First Name">
            <br>
            <input type="text" placeholder="Enter your Last Name">
            <h4>:first-letter|:first-line</h4>
            <p class="paragraph">
                Lorem ipsum dolor sit, amet consectetur adipisicing elit. Laboriosam est fugit omnis.
            </p>
            <h4>:before|:after</h4>
            <div class="heart"></div>
        </section>
    </main>
</body>
</html>

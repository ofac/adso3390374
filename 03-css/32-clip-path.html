<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>32-Clip Path</title>
    <link rel="stylesheet" href="../src/css/master.css">\
    <style>
        section {
            div.clip {
                background: url(imgs/pittsburgh.jpg) no-repeat 
                            center /cover;
                border-radius: 14px;
                corner-shape: squircle;
                margin: 0 auto;
                height: 300px;
                transition: all 0.2s ease-in;
                width: 300px;

                &.clip1 {
                    clip-path: polygon(50% 0%, 100% 0, 100% 57%, 100% 78%, 100% 100%, 49% 100%, 0 100%, 0 73%, 0 56%, 0 0);
                    &:hover {
                        clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
                    }
                }
                &.clip2 {
                    clip-path: polygon(20% 0%, 0 0, 0 49%, 0% 80%, 0 100%, 47% 100%, 100% 100%, 100% 80%, 100% 51%, 100% 0, 80% 0%, 48% 0);
                    &:hover {
                        clip-path: polygon(20% 0%, 0% 20%, 30% 50%, 0% 80%, 20% 100%, 50% 70%, 80% 100%, 100% 80%, 70% 50%, 100% 20%, 80% 0%, 50% 30%);
                    }
                }
            }
        }
    </style>
</head>
<body class="css">
    <a href="index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path></svg>
    </a>
    <main>
        <header class="mainmenu">
            <h1>32-Clip Path</h1>
            <h3>Property that creates a clipping region defining which parts of an element are visible</h3>
        </header>
        <section>
            <h4>Example 01:</h4>
            <div class="clip clip1"></div>
            <h4>Example 02:</h4>
            <div class="clip clip2"></div>
        </section>
    </main>
</body>
</html>

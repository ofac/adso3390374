<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30-Text Shadow</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section {
            p.txt {
                font-size: 2rem;
                margin-block: 4rem;
                text-align: center;

                &.txt1 { 
                    color: #000;
                    text-shadow: 0 0 6px #fff;
                 }
                 &.txt2 { 
                    color: #000;
                    text-shadow: -4px -4px 10px #fff;
                 }
                 &.txt3 { 
                    color: #fff9;
                    font-size: 6rem;
                    text-shadow:     0 1px 0 #c9cfce,
	                 0 2px 0 #bcc2c2,
	                 0 3px 0 #afb6b6,
	                 0 4px 0 #a4adac,
	                 0 5px 0 hsl(174,5%,64%),
	                 0 6px 0 hsl(174,5%,62%),
	                 0 7px 0 hsl(174,5%,61%),
	                 0 8px 0 hsl(174,5%,60%),
	
	                 0 0 5px rgba(0,0,0,.05),
	                0 1px 3px rgba(0,0,0,.2),
	                0 3px 5px rgba(0,0,0,.2),
	               0 5px 10px rgba(0,0,0,.2),
	              0 10px 10px rgba(0,0,0,.2),
	              0 20px 20px rgba(0,0,0,.3);
                 }
            }
        }
    </style>
</head>

    </a>
    <main>
        <header class="mainmenu">
            <h1>30-Text Shadow</h1>
            <h3>Property that adds shadow effects directly to text content, taking values for offset, blur radius, and color.</h3>
        </header>
        <section>
            <p class="txt txt1">ADSO</p>
            <p class="txt txt2">C.P.I.C</p>
            <p class="txt txt3">SENA</p>
            <p class="txt txt4">Caldas</p>
        </section>
    </main>
